name: Restore actual uploaded JNBC team photo

on:
  push:
    paths:
      - '.github/workflows/restore-uploaded-team-photo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore team photo
        run: python scripts/restore_actual_team_photo.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use uploaded JNBC core team group photo"
          git push
