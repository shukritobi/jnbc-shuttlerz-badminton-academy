name: Update header brand

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-header-brand.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update header brand text
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<span class="brand-name"><strong>JNBC Shuttlerz</strong><small>Badminton Academy</small></span>'
          new='<span class="brand-name"><strong>JNBC Shuttlerz Academy</strong></span>'
          if old not in s:
              raise SystemExit('Header brand block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update header brand name" || true
          git push origin main
