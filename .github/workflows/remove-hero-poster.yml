name: Remove hero stock poster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-hero-poster.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove Unsplash hero poster
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace(' preload="metadata" poster="https://images.unsplash.com/photo-1780233689566-55045608bd17?auto=format&fit=crop&w=1900&q=88" aria-hidden="true"', ' preload="metadata" aria-hidden="true"')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove stock hero poster"
          git push origin main
