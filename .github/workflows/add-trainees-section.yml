name: Add JNBC group trainees section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-trainees-section.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'id="trainees"' in s:
              raise SystemExit(0)
          marker='</div></div></section>\n<section class="section" id="training">'
          block='''</div></div></section>
<style>
.trainee-showcase{display:grid;grid-template-columns:1.35fr .65fr;gap:18px;align-items:stretch}.trainee-photo{position:relative;min-height:520px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#101621}.trainee-photo.side{min-height:520px}.trainee-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.trainee-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,8,13,.88),rgba(5,8,13,.04) 60%)}.trainee-caption{position:absolute;z-index:2;left:22px;right:22px;bottom:21px}.trainee-caption small{color:#86a0ff;font-size:.68rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.trainee-caption h3{font-size:2rem;margin:7px 0}.trainee-caption p{max-width:580px;margin:0;color:#c5ccd6;font-size:.8rem;line-height:1.6}.trainee-copy{max-width:720px;color:#b9c1cc;line-height:1.7;margin-bottom:30px}@media(max-width:800px){.trainee-showcase{grid-template-columns:1fr}.trainee-photo,.trainee-photo.side{min-height:430px}}@media(max-width:560px){.trainee-photo,.trainee-photo.side{min-height:360px}.trainee-caption h3{font-size:1.65rem}}
</style>
<section class="section alt" id="trainees"><div class="wrap"><div class="section-head"><div><span class="kicker">JNBC Group Trainees</span><h2>Learn together.<br>Progress together.</h2></div><p>Group training gives junior players a structured place to develop badminton fundamentals, movement, confidence, discipline and enjoyment alongside teammates.</p></div><div class="trainee-showcase"><article class="trainee-photo"><img loading="lazy" decoding="async" src="assets/images/trainees/jnbc-group-trainees-01.webp" alt="JNBC junior group trainees on badminton court"><div class="trainee-caption"><small>Junior Group Development</small><h3>Building Strong Fundamentals Together</h3><p>Structured group sessions combine technical learning, movement, repetition and a positive team environment.</p></div></article><article class="trainee-photo side"><img loading="lazy" decoding="async" src="assets/images/trainees/jnbc-group-trainees-02.webp" alt="JNBC junior group trainees"><div class="trainee-caption"><small>JNBC Trainees</small><h3>Basics First. Brilliance Next.</h3><p>A supportive pathway for young players to learn, improve and enjoy badminton.</p></div></article></div></div></section>
<section class="section" id="training">'''
          if marker not in s:
              raise SystemExit('training marker not found')
          s=s.replace(marker,block,1)
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add JNBC group trainees section" || exit 0
          git push origin main
