name: Update archive coach filter names

on:
  push:
    paths:
      - '.github/workflows/update-archive-filter-names.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update archive filters and coach labels
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('archive.html')
          text = html.read_text(encoding='utf-8')
          text = text.replace('data-archive-filter="praveen">Praveen</button>', 'data-archive-filter="praveentthen">Praveentthen</button>')
          marker = 'data-archive-filter="praveentthen">Praveentthen</button>'
          if 'data-archive-filter="muniandy"' not in text:
              text = text.replace(marker, marker + '<button class="filter" data-archive-filter="muniandy">Tn. Muniandy</button>')
          html.write_text(text, encoding='utf-8')

          js = Path('assets/js/archive.js')
          text = js.read_text(encoding='utf-8')
          text = text.replace('"person":"Justin Nathan","category":"achievement","title":"Veteran Doubles Champion","subtitle":"Coach Justin & Coach Muniandy — 2025"', '"person":"Justin Nathan & Tn. Muniandy","category":"achievement","title":"Veteran Doubles Champion","subtitle":"Coach Justin & Tn. Muniandy — 2025"')
          text = text.replace('"note":"2025 Men’s Veteran Doubles Champions — Coach Justin and Coach Muniandy."', '"note":"2025 Men’s Veteran Doubles Champions — Coach Justin and Tn. Muniandy."')
          text = text.replace('"person":"Justin Nathan","category":"achievement","title":"Perak Badminton Tournament","subtitle":"Veteran Champions — Coach Muniandy & Coach Justin"', '"person":"Justin Nathan & Tn. Muniandy","category":"achievement","title":"Perak Badminton Tournament","subtitle":"Veteran Champions — Tn. Muniandy & Coach Justin"')
          text = text.replace('"note":"2025 Perak Badminton Tournament veteran champions — Coach Muniandy and Coach Justin."', '"note":"2025 Perak Badminton Tournament veteran champions — Tn. Muniandy and Coach Justin."')
          js.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive.html assets/js/archive.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add Tn. Muniandy archive filter and correct Praveentthen name"
            git push
          fi