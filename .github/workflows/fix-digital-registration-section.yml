name: Fix digital registration section
on:
  push:
    paths:
      - '.github/workflows/fix-digital-registration-section.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace digital tools section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacement = '''<style>
#digital .digital-single{display:grid;grid-template-columns:.92fr 1.08fr;gap:64px;align-items:center}
#digital .digital-copy{max-width:560px}
#digital .digital-copy h2{margin:12px 0 20px}
#digital .digital-copy p{margin:0;color:#aeb7c6;line-height:1.75;max-width:520px}
#digital .digital-registration-card{min-height:330px;padding:40px;border-radius:26px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,#111824,#0c121b);border:1px solid var(--line)}
#digital .digital-registration-card .icon{font-size:2.1rem;margin-bottom:22px}
#digital .digital-registration-card h3{font-size:2.25rem;margin:0 0 12px}
#digital .digital-registration-card p{max-width:620px;margin:0 0 26px;color:#aeb7c6;line-height:1.7}
#digital .digital-registration-card .btn{align-self:flex-start;min-width:250px}
@media(max-width:820px){#digital .digital-single{grid-template-columns:1fr;gap:30px}#digital .digital-registration-card{min-height:auto;padding:28px}}
@media(max-width:560px){#digital .digital-registration-card{padding:24px}#digital .digital-registration-card h3{font-size:1.9rem}#digital .digital-registration-card .btn{width:100%;min-width:0}}
</style>
<section class="section" id="digital"><div class="wrap digital-single"><div class="digital-copy"><span class="kicker">Digital academy tools</span><h2>Register your player.<br>We'll take it from there.</h2><p>Submit the official JNBC player registration online. The academy can then confirm the suitable programme, schedule and venue directly with you.</p></div><article class="tool digital-registration-card"><div class="icon">📝</div><h3>Player Registration</h3><p>Complete participant, guardian and relevant medical details in one place, then send the registration directly to Coach Justin via WhatsApp.</p><a class="btn secondary" href="register.html">Open Registration →</a></article></div></section>'''

          pattern = re.compile(r'<section class="section" id="digital">.*?</section>', re.S)
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Expected 1 digital section, found {count}')
          p.write_text(s2, encoding='utf-8')
          print('Updated digital registration section')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify and rebalance registration section"
          git push
# trigger