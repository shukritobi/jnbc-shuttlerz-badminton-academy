name: Remove coach ages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-coach-ages.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove ages from coach names
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
              'Puvendran, 25': 'Puvendran',
              'Nantha Kumar, 29': 'Nantha Kumar',
              'R. Muniandy, 61': 'R. Muniandy',
              'Kavisha, 19': 'Kavisha',
              'Kavisha ,19': 'Kavisha',
              'Denesh, 26': 'Denesh',
              'Denesh,26': 'Denesh',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove ages from coach profiles"
          git push origin main
