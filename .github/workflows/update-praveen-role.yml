name: Update Praveen role label

on:
  push:
    paths:
      - '.github/workflows/update-praveen-role.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Praveen role
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<article class="coach-card praveen-card"><div class="coach-photo"><img src="assets/images/coaches/praveen-profile.webp" alt="Praveenthen" loading="lazy" decoding="async" onerror="this.style.display=\'none\';this.parentElement.classList.add(\'missing\');this.parentElement.innerHTML=\'<div class=missing-mark><b>P</b><span>Photo coming soon</span></div>\'"></div><div class="coach-info"><span class="role">JNBC Coach</span><h3>Praveenthen</h3>'
          new = '<article class="coach-card praveen-card"><div class="coach-photo"><img src="assets/images/coaches/praveen-profile.webp" alt="Praveenthen" loading="lazy" decoding="async" onerror="this.style.display=\'none\';this.parentElement.classList.add(\'missing\');this.parentElement.innerHTML=\'<div class=missing-mark><b>P</b><span>Photo coming soon</span></div>\'"></div><div class="coach-info"><span class="role">JNBC Coach • Junior Trainee Development • Focusing on Group & Personal Training</span><h3>Praveenthen</h3>'
          if old not in s:
              raise SystemExit('Praveen card pattern not found; no changes made')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/update-praveen-role.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-praveen-role.yml
          git commit -m "Update Praveen coaching role"
          git push