name: Apply new JNBC branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-new-branding.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update branding and hero
        run: |
          python - <<'PY'
          from pathlib import Path

          # Update naming across all public HTML pages.
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('JNBC Shuttlerz Badminton Academy', 'JNBC Shuttlerz Academy')
              s = s.replace('JNBC SHUTTLERZ BADMINTON ACADEMY', 'JNBC SHUTTLERZ ACADEMY')
              p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Header: new logo already contains the academy wordmark, so avoid duplicating it.
          s = s.replace('.brand{display:flex;align-items:center;gap:13px;min-width:315px}.brand-logo{width:112px;height:72px;object-fit:contain;object-position:left center}',
                        '.brand{display:flex;align-items:center;gap:10px;min-width:220px}.brand-logo{width:190px;height:70px;object-fit:contain;object-position:left center}')
          s = s.replace('.brand-name{line-height:.92}', '.brand-name{display:none;line-height:.92}')

          # Hero: replace the oversized first line with the new brand mark and tighten hierarchy.
          s = s.replace('.hero-content{padding:90px 0 100px;align-self:center}', '.hero-content{padding:72px 0 92px;align-self:center}')
          s = s.replace('h1{font-size:clamp(4rem,7.5vw,7rem);letter-spacing:-.035em;margin:20px 0 25px}',
                        'h1{font-size:clamp(3.2rem,5.3vw,5.35rem);letter-spacing:-.03em;margin:10px 0 20px;max-width:620px}')
          s = s.replace('.lead{font-size:1.05rem;line-height:1.75;color:#c4cad4;max-width:640px}',
                        '.lead{font-size:.92rem;line-height:1.7;color:#c4cad4;max-width:590px}')
          s = s.replace('.hero-points{display:flex;gap:10px;flex-wrap:wrap;margin:31px 0}.hero-point{padding:10px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:#d7dbe3;font-size:.76rem;font-weight:700}',
                        '.hero-points{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.hero-point{padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:#d7dbe3;font-size:.66rem;font-weight:700}')
          s = s.replace('.hero-badge{position:absolute;right:0;bottom:68px;width:300px;padding:20px;', '.hero-badge{position:absolute;right:0;bottom:68px;width:280px;padding:17px;')
          s = s.replace('.hero-badge small{color:#7f96ff;font-weight:900;text-transform:uppercase;letter-spacing:.1em}', '.hero-badge small{color:#7f96ff;font-size:.64rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em}')
          s = s.replace('.hero-badge strong{display:block;font:900 1.85rem "Barlow Condensed";text-transform:uppercase;margin:7px 0}', '.hero-badge strong{display:block;font:900 1.55rem "Barlow Condensed";text-transform:uppercase;margin:6px 0}')
          s = s.replace('.hero-badge span{color:#b8bfca;font-size:.78rem;line-height:1.55}', '.hero-badge span{color:#b8bfca;font-size:.69rem;line-height:1.5}')
          s = s.replace('.service-pill{padding:20px 22px;', '.service-pill{padding:16px 20px;')
          s = s.replace('.service-pill b{display:block;color:#fff;font:800 1.23rem "Barlow Condensed";text-transform:uppercase}.service-pill span{font-size:.72rem;color:#919ba9}', '.service-pill b{display:block;color:#fff;font:800 1.05rem "Barlow Condensed";text-transform:uppercase}.service-pill span{font-size:.64rem;color:#919ba9}')

          # New hero logo treatment.
          extra_css = '''\n.hero-brand{display:block;margin:0 0 20px}.hero-brand-logo{width:min(390px,78vw);height:auto;max-height:145px;object-fit:contain;object-position:left center}.footer-brand img{width:220px!important;height:auto!important;max-height:90px;object-fit:contain;object-position:left center}@media(max-width:700px){.brand-logo{width:150px;height:58px}.hero-brand-logo{width:min(300px,78vw)}h1{font-size:clamp(2.9rem,13vw,4.3rem)}.lead{font-size:.86rem}.hero-point{font-size:.62rem}.hero-badge{width:240px;padding:14px}.service-pill b{font-size:.95rem}.service-pill span{font-size:.6rem}}\n'''
          if '.hero-brand-logo{' not in s:
              s = s.replace('</style>', extra_css + '</style>', 1)

          old = '<span class="kicker">JNBC Shuttlerz Academy</span><h1>Train with purpose.<br><span class="red">Progress with confidence.</span></h1>'
          new = '<picture class="hero-brand"><source srcset="assets/images/branding/logo.webp" type="image/webp"><img class="hero-brand-logo" src="assets/images/branding/jnbc-logo.png" alt="JNBC Shuttlerz Academy"></picture><h1><span class="red">Progress with confidence.</span></h1>'
          if old in s:
              s = s.replace(old, new, 1)
          else:
              # Handles the pre-brand-name variant if replacement order differs.
              s = s.replace('<span class="kicker">JNBC Shuttlerz Badminton Academy</span><h1>Train with purpose.<br><span class="red">Progress with confidence.</span></h1>', new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Use new JNBC logo and simplify hero branding" || exit 0
          git push origin main
