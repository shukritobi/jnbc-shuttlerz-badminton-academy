name: Replace site logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-logo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update logo references
        run: |
          python - <<'PY'
          from pathlib import Path

          # Homepage: prefer new WebP, keep current PNG as fallback.
          p = Path('index.html')
          s = p.read_text()
          s = s.replace(
              '<img class="brand-logo" src="assets/images/branding/jnbc-logo.png" alt="JNBC Shuttlerz Badminton Academy logo" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'">',
              '<picture><source srcset="assets/images/branding/logo.webp" type="image/webp"><img class="brand-logo" src="assets/images/branding/jnbc-logo.png" alt="JNBC Shuttlerz Badminton Academy logo" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"></picture>'
          )
          s = s.replace(
              '<img src="assets/images/branding/jnbc-logo.png" alt="JNBC Shuttlerz logo" onerror="this.style.display=\'none\'">',
              '<picture><source srcset="assets/images/branding/logo.webp" type="image/webp"><img src="assets/images/branding/jnbc-logo.png" alt="JNBC Shuttlerz logo" onerror="this.style.display=\'none\'"></picture>'
          )
          p.write_text(s)

          # Registration and payment pages already use <picture>.
          for name in ['register.html', 'payment.html']:
              p = Path(name)
              s = p.read_text()
              s = s.replace(
                  '<source srcset="assets/images/branding/jnbc-logo.svg" type="image/svg+xml">',
                  '<source srcset="assets/images/branding/logo.webp" type="image/webp">'
              )
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html register.html payment.html
          git commit -m "Prefer new WebP logo across site"
          git push origin main
