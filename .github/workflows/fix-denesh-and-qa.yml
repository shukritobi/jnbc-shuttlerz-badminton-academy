name: JNBC visual QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-denesh-and-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/jnbc-http.log 2>&1 &
          sleep 2

      - name: Install Playwright Chromium
        run: |
          npx -y playwright@1.54.2 install --with-deps chromium

      - name: Capture desktop screenshot
        run: |
          npx -y playwright@1.54.2 screenshot --browser=chromium --viewport-size="1440,1000" --full-page --wait-for-timeout=3500 http://127.0.0.1:8000/ jnbc-desktop.png

      - name: Capture mobile screenshot
        run: |
          npx -y playwright@1.54.2 screenshot --browser=chromium --viewport-size="390,844" --full-page --wait-for-timeout=3500 http://127.0.0.1:8000/ jnbc-mobile.png

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jnbc-ui-qa
          path: |
            jnbc-desktop.png
            jnbc-mobile.png
          if-no-files-found: warn
          retention-days: 3
