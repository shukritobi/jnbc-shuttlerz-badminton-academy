name: Polish JNBC core team layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-denesh-and-qa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Center final coach card on desktop
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<article class="coach-card"><div class="coach-photo"><img src="assets/images/coaches/denesh.png"'
          new='<article class="coach-card denesh-card"><div class="coach-photo"><img src="assets/images/coaches/denesh.png"'
          if old in s:
              s=s.replace(old,new,1)
          css='@media(min-width:1051px){.denesh-card{grid-column:2}}\n'
          marker='@media(max-width:1050px)'
          if css.strip() not in s:
              s=s.replace(marker,css+marker,1)
          p.write_text(s)
          PY
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Center Denesh card on desktop" || true
          git push origin main
