name: Remove video note
on:
  push:
    paths:
      - '.github/workflows/remove-video-note.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove video implementation note
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/js/jnbc-videos.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  .video-note{margin-top:17px;color:#7f8998;font-size:.72rem;line-height:1.55}\n", "")
          s = s.replace('<div class="video-gallery">${videos.map(cardHtml).join(\'\')}</div><p class="video-note">Lightweight by design: only small WebP poster images load with the page. Each MP4 is loaded only after a visitor chooses a video.</p></div>', '<div class="video-gallery">${videos.map(cardHtml).join(\'\')}</div></div>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/jnbc-videos.js
          git commit -m "Remove video implementation note"
          git push