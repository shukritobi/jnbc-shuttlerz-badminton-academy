name: Cleanup redundant copy and footer
on:
  push:
    paths:
      - '.github/workflows/cleanup-copy-footer.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          original = s

          # Remove the lightweight implementation note beneath the training videos.
          s = re.sub(
              r'<(?P<tag>p|div|span)(?P<attrs>[^>]*)>\s*Lightweight by design:\s*only small WebP poster images load with the page\.\s*Each MP4 is loaded only after a visitor chooses a video\.\s*</(?P=tag)>',
              '', s, flags=re.I | re.S
          )

          # Remove testimonial editing/privacy explanatory note.
          s = re.sub(
              r'<(?P<tag>p|div|span)(?P<attrs>[^>]*)>\s*Testimonials have been lightly edited for spelling and readability while keeping the original meaning\.\s*Trainee names are not shown, in line with the academy(?:\'|&#39;|&apos;)s request\.\s*</(?P=tag)>',
              '', s, flags=re.I | re.S
          )

          # Remove the caption below the core-team group image.
          s = re.sub(
              r'<(?P<tag>p|div|span)(?P<attrs>[^>]*)>\s*Seven core members bringing together coaching, player development, programme strategy, discipline and long-term academy growth\.\s*</(?P=tag)>',
              '', s, flags=re.I | re.S
          )

          # Replace the old footer explanatory paragraph with the requested copyright.
          footer_pattern = re.compile(
              r'(<(?P<tag>p|div|span)(?P<attrs>[^>]*)>)\s*JNBC Shuttlerz Academy information and coach profiles are based on material supplied by the academy\.\s*Final programme schedules, venues, fees and additional achievements can be updated as they are confirmed\.\s*(</(?P=tag)>)',
              flags=re.I | re.S
          )
          s, footer_count = footer_pattern.subn(
              r'\1© 2026 JNBC SHUTTLERZ BADMINTON ACADEMY\4', s
          )

          # Fallback if the footer paragraph was already altered but no copyright exists.
          if '© 2026 JNBC SHUTTLERZ BADMINTON ACADEMY' not in s:
              s = s.replace('</footer>', '<div class="wrap" style="padding:0 0 28px;color:#7f8897;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase">© 2026 JNBC SHUTTLERZ BADMINTON ACADEMY</div></footer>', 1)

          if s == original:
              print('No changes were needed.')
          else:
              path.write_text(s, encoding='utf-8')
              print('Homepage updated.')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clean up homepage copy and footer"
          git push