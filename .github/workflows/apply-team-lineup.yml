name: Apply full team lineup fix

on:
  push:
    paths:
      - '.github/workflows/apply-team-lineup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply lineup
        run: python scripts/apply_team_lineup.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show all seven JNBC core team members in banner"
          git push
