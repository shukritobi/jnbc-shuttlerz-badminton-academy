name: Add core team group photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-core-team-group-photo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add group photo to coaches section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'class="core-team-group"' not in s:
              css = '''\n.core-team-group{position:relative;margin:4px 0 34px;border-radius:24px;overflow:hidden;background:#111722;border:1px solid #dfe4ec;box-shadow:0 18px 46px rgba(12,20,34,.12)}\n.core-team-group img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:center center}\n.core-team-group:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,8,14,.88) 0%,rgba(5,8,14,.12) 46%,transparent 70%);pointer-events:none}\n.core-team-group-copy{position:absolute;z-index:2;left:28px;right:28px;bottom:24px;display:flex;align-items:end;justify-content:space-between;gap:24px;color:white}\n.core-team-group-copy small{display:block;margin-bottom:7px;color:#9eb0ff;font-size:.68rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}\n.core-team-group-copy h3{font-size:clamp(2rem,4vw,3.3rem);margin:0}\n.core-team-group-copy p{max-width:470px;margin:0;color:#d4dae4;font-size:.78rem;line-height:1.55;text-align:right}\n@media(max-width:700px){.core-team-group{margin-bottom:24px;border-radius:18px}.core-team-group-copy{left:16px;right:16px;bottom:14px;display:block}.core-team-group-copy h3{font-size:2rem}.core-team-group-copy p{display:none}}\n'''
              s = s.replace('</style>', css + '</style>', 1)

              group = '''<div class="core-team-group"><img src="assets/images/coaches/jnbc-core-team-group.webp" alt="JNBC Shuttlerz Academy core coaching team" loading="lazy" decoding="async"><div class="core-team-group-copy"><div><small>JNBC Core Team</small><h3>One team. One standard.</h3></div><p>Six core members bringing together coaching, player development, programme strategy, discipline and long-term academy growth.</p></div></div>'''
              s = s.replace('<div class="coach-grid">', group + '<div class="coach-grid">', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Feature JNBC core team group photo" || exit 0
          git push origin main
