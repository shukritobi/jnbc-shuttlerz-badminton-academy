name: Apply JNBC UI fixes

on:
  push:
    paths:
      - '.github/workflows/apply-jnbc-ui-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix team banner and favicon links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')

          # The old 16:9 + cover rule was cropping the two people at the edges.
          s = re.sub(
              r'\.core-team-group img\{[^}]*\}',
              '.core-team-group img{display:block;width:100%;height:auto;max-height:none;aspect-ratio:auto;object-fit:contain;object-position:center center}',
              s,
              count=1,
          )

          safeguard = '''\n<style id="core-team-full-photo-fix">\n.core-team-group{height:auto!important;min-height:0!important;aspect-ratio:auto!important}\n.core-team-group>img{position:relative!important;inset:auto!important;width:100%!important;height:auto!important;max-height:none!important;aspect-ratio:auto!important;object-fit:contain!important;object-position:center center!important}\n.hero-brand-subtitle{display:none!important}\n</style>\n'''
          if 'id="core-team-full-photo-fix"' not in s:
              s = s.replace('</head>', safeguard + '</head>', 1)
          index.write_text(s, encoding='utf-8')

          favicon = '<link rel="icon" type="image/png" sizes="96x96" href="favicon.png">\n<link rel="shortcut icon" href="favicon.png">\n<link rel="apple-touch-icon" href="favicon.png">\n'
          for page in Path('.').glob('*.html'):
              html = page.read_text(encoding='utf-8')
              if 'href="favicon.png"' not in html:
                  html = html.replace('</head>', favicon + '</head>', 1)
                  page.write_text(html, encoding='utf-8')
          PY

      - name: Remove temporary setup files and commit
        run: |
          rm -rf .branding
          rm -f .github/workflows/apply-jnbc-ui-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Fix full team photo, update logo and add favicon"
            git push
          fi
