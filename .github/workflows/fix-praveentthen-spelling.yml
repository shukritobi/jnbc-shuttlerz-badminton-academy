name: Fix Praveentthen spelling site-wide

on:
  push:
    paths:
      - 'index.html'
      - 'archive.html'
      - 'assets/js/**'
      - 'README.md'
      - '.github/workflows/fix-praveentthen-spelling.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace visible misspellings in site files
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('index.html'),
              Path('archive.html'),
              Path('assets/js/archive.js'),
          ]
          replacements = {
              'Praveenthen': 'Praveentthen',
              'PRAVEENTHEN': 'PRAVEENTTHEN',
              'Praveen': 'Praveentthen',
              'PRAVEEN': 'PRAVEENTTHEN',
          }

          changed = []
          for p in targets:
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              new = text
              for old, correct in replacements.items():
                  new = new.replace(old, correct)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))

          print('Changed files:')
          for p in changed:
              print(p)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive.html assets/js/archive.js
          if git diff --cached --quiet; then
            echo "No spelling changes needed"
          else
            git commit -m "Correct Praveentthen spelling site-wide"
            git push
          fi