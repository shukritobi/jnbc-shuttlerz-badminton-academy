name: Fix Praveentthen spelling site-wide

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace misspellings in text files
        run: |
          python - <<'PY'
          from pathlib import Path

          exts = {'.html','.js','.css','.md','.json','.txt','.yml','.yaml'}
          replacements = {
              'Praveenthen': 'Praveentthen',
              'PRAVEENTHEN': 'PRAVEENTTHEN',
              'Praveen': 'Praveentthen',
              'PRAVEEN': 'PRAVEENTTHEN',
          }

          changed = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts:
                  continue
              if '.git' in p.parts:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, correct in replacements.items():
                  new = new.replace(old, correct)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))

          print('Changed files:')
          for p in changed:
              print(p)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No spelling changes needed"
          else
            git commit -m "Correct Praveentthen spelling site-wide"
            git push
          fi