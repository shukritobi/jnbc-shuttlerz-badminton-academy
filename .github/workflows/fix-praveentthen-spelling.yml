name: Fix Praveentthen spelling site-wide

on:
  push:
    paths:
      - 'index.html'
      - 'archive.html'
      - 'assets/js/**'
      - '.github/workflows/fix-praveentthen-spelling.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct visible name variants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = [Path('index.html'), Path('archive.html'), Path('assets/js/archive.js')]
          patterns = [
              (r'\bPraveentthentthen\b', 'Praveentthen'),
              (r'\bPraveenthen\b', 'Praveentthen'),
              (r'\bPraveen\b', 'Praveentthen'),
              (r'\bPRAVEENTTHENTTHEN\b', 'PRAVEENTTHEN'),
              (r'\bPRAVEENTHEN\b', 'PRAVEENTTHEN'),
              (r'\bPRAVEEN\b', 'PRAVEENTTHEN'),
          ]

          changed = []
          for p in targets:
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              new = text
              for pattern, replacement in patterns:
                  new = re.sub(pattern, replacement, new)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))

          print('Changed files:')
          for p in changed:
              print(p)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive.html assets/js/archive.js
          if git diff --cached --quiet; then
            echo "No spelling changes needed"
          else
            git commit -m "Normalize Praveentthen spelling site-wide"
            git push
          fi